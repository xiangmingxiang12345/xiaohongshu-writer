server:
  port: 3000

spring:
  jackson:
    default-property-inclusion: non_null

ai:
  provider: openai        # claude 或 openai
  api-key: "${AI_API_KEY:}"                                  # 从环境变量读取，启动时设置
  claude:
    api-url: https://api.anthropic.com/v1
    model: claude-sonnet-4-20250514
  openai:
    api-url: https://api.deepseek.com/v1
    model: deepseek-chat
